## Image generation via Codex CLI

**CRITICAL flags (verified on Windows):**
- `--dangerously-bypass-approvals-and-sandbox` — without it `codex exec` runs `sandbox: read-only`
  and fails with `windows sandbox: spawn setup refresh` when it tries to spawn the image generator
  or write the file. Required for non-interactive image gen.
- `--skip-git-repo-check` — outside a trusted directory `codex exec` refuses with `Not inside a trusted
  directory and --skip-git-repo-check was not specified`, then prints `Reading additional input from
  stdin...` and **hangs** until the timeout. The failure looks like a prompt problem and is not.
- Reference images use `-i FILE` (repeatable). **`-i` is variadic and greedily consumes a trailing
  positional prompt** — so when attaching references, pass the prompt via **stdin**, not as an arg,
  or codex hangs on \"Reading prompt from stdin...\".
- Verified one-liner with a reference — **both flags**, prompt first (a *leading* positional is not
  what `-i` swallows), `-i` last, stdin closed:
  ```bash
  codex exec --dangerously-bypass-approvals-and-sandbox --skip-git-repo-check \\
    \"$(cat prompt.txt)\" -i ref.png < /dev/null
  ```
  Equivalent stdin form, when the prompt is long or has characters the shell would eat:
  ```bash
  cat prompt.txt | codex exec --dangerously-bypass-approvals-and-sandbox --skip-git-repo-check -i ref.png
  ```

```bash
# No references — prompt as positional arg is fine
codex exec --dangerously-bypass-approvals-and-sandbox \\
  \"Generate an image: PROMPT_HERE. Save it to OUTPUT_PATH.\"
```

```bash
# With reference images — prompt via stdin, refs via repeated -i
cat prompt.txt | codex exec --dangerously-bypass-approvals-and-sandbox \\
  -i ref1.png -i ref2.png -i ref3.png
```

```powershell
# Windows PowerShell, with references
Get-Content -Raw prompt.txt | codex exec --dangerously-bypass-approvals-and-sandbox `
  -i \"ref1.png\" -i \"ref2.png\" -i \"ref3.png\"
```

Structured prompt body (put in the file / arg):

```
Generate an image with these specifications:
Subject: [subject]
Style: [style]
Composition: [layout]
Lighting: [lighting]
Colours: [palette]
Text in image: [exact text in quotes, or none]
Save the image to: OUTPUT_PATH
```

Codex generates images natively through OpenAI's gpt-image-2 model. Output goes to
`~/.codex/generated_images/<session>/` by default — codex copies to the requested path when told,
otherwise copy the newest PNG from that dir afterwards.

**Parallel-safe copy by session-id (preferred).** Each `codex exec` prints `session id: <uuid>` and
writes ONLY into `~/.codex/generated_images/<uuid>/`. Copy the PNG **from that session's subdir**, not
\"newest global\": `SID=$(printf '%s' \"$OUT\" | grep -oiE 'session id: [0-9a-fA-F-]+' | awk '{print $NF}'); cp \"$(ls -t ~/.codex/generated_images/$SID/*.png | head -1)\" dest.png`.
This makes it **collision-proof to run N codex in parallel** (validated: 30 gens, 4/batch, 0 swaps) —
the old \"never run codex in parallel\" swap bug was only from copying newest-global.

**Lote de N imagens — um script, não N agentes (decisão de 2026-10-01).** Um agente recebe a
lista inteira e lança **um só script como UM job `run_in_background`** (passa o watchdog de 600 s
sem progresso): prompt base + `-i` referência por imagem, loop sequencial ou com concorrência limitada
**dentro do mesmo processo** (ex.: `xargs -P4`), cópia pela session-id acima, **tecto por imagem**
(≤4 min por geração, ex.: `timeout 240` onde existir). O script escreve **um log por imagem** (nome de destino ·
session id · ok/falhou/timeout) e, ao relançar, **salta as que já existem e passam o `file`** — retoma só
as que falharam. O agente acompanha o log (não lança mais jobs) e devolve uma vez, no fim, com a lista
ok/falhou. Caso medido: 32/32 com um runner destes
(2026-09-27). Não há script canónico no toolkit: escreve-se no projecto, ao lado dos prompts.

**Chave de API sem créditos → o codex cai na geração integrada e grava noutro sítio.** Grava na pasta
de trabalho (não em `~/.codex/generated_images/`) e só o diz no relatório final (2026-09-13). Recolher
**pelo caminho que o codex reporta**, não só pela pasta de sessão, e avisar o utilizador de que a chave não
tem créditos.

**Destino nunca em UNC/drive de rede.** O `codex exec` **não escreve** em paths de rede (`\\\\servidor\\…`,
`G:` do Google Drive File Stream, Dropbox e outras clouds montadas): responde \"guardei\", sai com **exit code 0**, e
o ficheiro nunca aparece. Se o destino do brief for um desses, gerar/copiar primeiro para um path
**local** (ex.: `$TEMP`) e só depois mover para o destino final.

**Validar o destino antes de reportar sucesso — exit code 0 não é prova.** Confirmar que o ficheiro é
mesmo PNG e tem tamanho plausível: `file dest.png` tem de devolver `PNG image data, WxH`; em PowerShell,
os magic bytes `[IO.File]::ReadAllBytes($p)[0..3]` têm de ser `137 80 78 71`. Num run, \"copiar\" o
resultado com `Get-ChildItem` no directório de trabalho apanhou um `.log` de texto e escreveu 6 KB com
extensão `.png` — uma imagem que não era imagem. Falha a validação → apagar o ficheiro falso, reportar
e parar.

**Medir o alfa — `file` diz só «RGBA», não diz se há transparência.** O `gpt-image-2` devolveu 3 de ~20
mockups com **alfa parcial em toda a imagem** (bordas a desvanecer); embebidos como JPEG saíram com lixo
nas bordas (2026-09-24). Antes de reportar:
```bash
python3 -c \"from PIL import Image;import numpy as np;a=np.asarray(Image.open('dest.png'));print(a[...,3].min() if a.ndim==3 and a.shape[-1]==4 else 255)\"
```
`min(alpha) < 255` num mockup/cena opaca → reportar **«alfa parcial»** com o valor; o caller achata ou
corta antes de usar. (Asset pedido com fundo transparente: alfa < 255 é o esperado.)

**Não redireccionar logs para o directório de output.** Nada de `> run.log` / `2> err.log` na pasta onde
o codex procura ou deposita a imagem — um ficheiro de texto ali passa a candidato do \"copiar o mais
recente\".

**Exact small digits are unreliable.** gpt-image-2 regenerates; when a prompt pins a small variable
string (a serial, a count, a year on a fixed-layout label), the model often ignores it and anchors on
memorized/plausible values (~30% miss, retries don't fix). For exact variable fields, composite the text
by code (Pillow) over the AI chrome — do NOT trust the model to render them.

### If the user insists: section-by-section regeneration

The limit above stands — **no faithful recreation of a text-heavy layout in one shot**; say so first. When
the user insists anyway (a poster to be re-rendered at print size, a banner to be rebuilt), the technique
that produced a usable result is: cut the source into **overlapping** sections → regenerate each section
individually → register each output back onto the source by **template-matching on gradients** (not on raw
pixels — the AI shifts colour/exposure per section, gradients survive it) → **stitch on a minimum-error
seam** through the overlap.

Four traps, each of which sinks the naive version:

1. **The model completes elements cut by the section border.** A car sliced in half comes back as a whole
   car, a letter clipped at the edge comes back as a different letter. Cut sections so that the borders
   fall on empty/flat areas, and state in the prompt that content cut off at the edge stays cut off.
2. **No overlap ⇒ the seam breaks letters.** Sections must overlap enough for the seam to have somewhere
   to run (a full glyph width at minimum); a butt-joint always lands mid-glyph somewhere.
3. **A global brand rule contaminates the other brands in the same layout.** A layout carrying two brands,
   given one prompt with one brand's palette/typography rules, comes back with the second brand restyled
   into the first. Prompt each section with **only** the rules of the brand present in that section; never
   put a layout-wide brand instruction in a per-section prompt.
4. **The seam cost function needs a structure term.** Pure colour-difference cost cuts straight through
   objects (it happily runs the seam across a face or a wordmark because the colours match). Add a
   gradient/edge term to the cost so the seam prefers flat regions and goes around structure.

Verify by rasterising the stitched result next to the source and comparing region by region — never by
declaring the stitch \"clean\" from the script's exit code.

## Reliability (Windows/codex)

- **LF line endings in prompt files.** Write `prompt.txt` with LF, not CRLF. PowerShell `Set-Content`
  emits CRLF, which makes codex warn `carriage return must be followed by newline`. Normalize:
  `[IO.File]::WriteAllText($path, ($body -replace \"`r`n\",\"`n\"))` or pipe the prompt via stdin string.
- **Force the imagegen tool, no web search.** In ~1/3 of runs codex derails into a web search
  (e.g. \"how to save generated image from API\") instead of calling the tool. The prompt MUST state
  explicitly: \"use the imagegen tool directly, do NOT web search\". Launch **N+1 attempts** for N
  requested images to absorb derailed runs.
- **Prefer inline over delegated on Windows.** When spawned as a subagent, codex sometimes behaves as
  if it has no shell and just echoes the command back as text. On Windows, generation runs more
  reliably **inline via PowerShell** than delegated to a subagent.
- **API-doc fallback (WebFetch).** WebFetch cannot read JS-rendered API docs (Swagger/Redoc/Scalar) —
  it returns an empty shell. Fall back to the raw OpenAPI spec path (`/openapi.json`, `/swagger.json`)
  or use firecrawl.

## Prompt construction rules

Be explicit and literal. The model follows detailed instructions closely.

**General structure:**
```
[Medium/style] of [subject], [composition], [lighting], [colour palette], [mood], [technical quality]
```

**Contrapeso — explícito no PRODUTO, solto na CENA.** Produto deformado (proporções erradas, forma
trocada) costuma ser prompt a mais: cortar a descrição da cena, manter só a restrição do produto.
Sobre-especificar a composição consome a margem de que o modelo precisa para a geometria (2026-09-02).

**Text in image — always quote exact text:**
```
Product photography of a wine bottle with label reading \"Monte Velho Reserva 2021\"
in gold italic serif font on a dark green label, studio lighting, white background
```

**Product shot formula:**
```
Professional product photography of [product], [material/finish], on [surface/background],
[lighting type], isolated, sharp focus, 8K commercial advertising quality
```

**Text accuracy tips:**
- Quote text in double quotes within the prompt
- Specify font style: `serif`, `sans-serif`, `handwritten`, `bold`, `italic`
- Specify colour and placement

**Size/quality hints in prompt:**
- Draft: \"low quality, quick draft\"
- Standard: \"high quality\"
- Final: \"professional quality, 8K, commercial advertising\"

## Output

**Resolução de saída — medir na 1.ª geração da vaga, não assumir de notas:**

| Pedido | Saiu | Data |
|---|---|---|
| retrato (`gpt-image-2`, via `codex exec`; a memória dizia 1024×1536) | 1086×1448 (3:4 exacto) | verificado 2026-09-02 |
| retrato 2:3 só por rácio | 864×1821 (rácio de story) | verificado 2026-09-05 |

O rácio sozinho não chega: o prompt leva o tamanho em píxeis à letra — **«EXACTLY 1024×1536 pixels»** — que
resolveu à 2.ª tentativa. Medir sempre (`sips -g pixelWidth -g pixelHeight`) antes de aceitar.

After successful generation, report:
```
✓ Image generated via Codex CLI (OpenAI gpt-image-2)
  Path: [output path]
  Prompt: [first 80 chars...]
```

If error: report clearly and stop. Erro 429 → relatório com `plan_type` + `resets_in_seconds` + hora de reset e o path do prompt gravado (hard limit 5).

Critério de aceitação do brief = **acção executada sobre a imagem** (percorrer, contar, comparar com a
referência), nunca «sim» a uma pergunta fechada — o relatório traz o resultado dessa acção (`img-gen.md` §4).
