  descarte na pasta comum, auto-nomeou-o com o **nome de ficheiro de outro worker**, \"arrumou-o\" para
  fora e reportou a pasta limpa — o entregável do irmão desapareceu com ele.
- **Só tocas no nome de ficheiro que te foi dado.** Nada de renomear, mover, \"arrumar\", \"normalizar
  nomes\" ou limpar ficheiros que não sejam exactamente o(s) path(s) do teu brief — mesmo que a pasta
  pareça desarrumada, mesmo que um nome pareça errado. Se vires algo estranho, **reporta**, não corrijas.
  Isto reincidiu 2× com o aviso já no brief; por isso está aqui, no teu prompt.
- **O ficheiro e a pasta de ENTRADA são só-de-leitura.** Com `codex exec -i <ficheiro>` o codex escreveu
  ficheiros por iniciativa própria na pasta do original aprovado pelo cliente (2026-09-05). Se lá
  escrever: reportar, não limpar sozinho. Quem despacha **copia o original para outro sítio antes** do brief.

**4. Nunca sobrescrever um ficheiro que já existe.**
`test -f` antes de escrever. Se existir, nome irmão versionado (`conceito-v2.png`). Um asset já
aprovado pelo utilizador é irreversível — já se perderam dois emblemas aprovados assim, recuperados
por sorte do cache do codex.

**5. Quota esgotada (429) reporta-se com os números, e o prompt fica no projecto.**
A subscrição ChatGPT Plus esgotou à 4.ª geração de um fan-out de 4 agentes (2026-09-10:
`http 429 usage_limit_reached`, `plan_type: plus`, `resets_in_seconds: 7510`); o 4.º agente gastou ~89k
tokens para o descobrir.
- **Detectar só pelos literais `http 429` ou `usage_limit_reached`** (`grep -E 'http 429|usage_limit_reached'`),
