name: Bug
description: Something that should work and does not
labels: ["type: bug"]
body:
  - type: textarea
    id: esperado
    attributes:
      label: What should happen
    validations:
      required: true

  - type: textarea
    id: aconteceu
    attributes:
      label: What happens
    validations:
      required: true

  - type: textarea
    id: reproduzir
    attributes:
      label: How to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: impacto
    attributes:
      label: Impact
      options:
        - Blocks the user — no way around it
        - Annoying — there is a way around it
        - Cosmetic
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Context
      description: Environment, affected user, error messages, log entries.
