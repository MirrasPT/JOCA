# Fase C3 — CI: formatação, análise estática e testes.
#
# ⚠️ SUBSTITUI o .github/workflows/tests.yml que vem no starter kit.
#    Apagar esse ficheiro — se ficarem os dois, o do starter kit corre em
#    PHP 8.3 e parte assim que o Pest 5 entrar.
#
# Pressupõe: Pest 5 (PHP 8.4+), Pint e Larastan (já vêm no starter kit,
# com phpstan.neon na raiz).
#
# Base de dados: SQLite em memória, como o phpunit.xml do starter kit define.
# Se o projeto precisar de MySQL nos testes, ver a nota no fim do ficheiro.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Localizar a cache do Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (formatação)
        run: ./vendor/bin/pint --test

      - name: Larastan (análise estática)
        run: ./vendor/bin/phpstan analyse --no-progress

      # Se o projeto tiver frontend a compilar (Vite), descomentar:
      # - uses: actions/setup-node@v7
      #   with:
      #     node-version: '24'
      #     cache: 'npm'
      # - run: npm ci && npm run build

      - name: Pest
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: ./vendor/bin/pest

# ---------------------------------------------------------------------------
# Se precisarem mesmo de MySQL (funcionalidades que dependem do motor:
# JSON columns, full-text search, tipos específicos), acrescentar ao job:
#
#     services:
#       mysql:
#         image: mysql:8.4
#         env:
#           MYSQL_ROOT_PASSWORD: root
#           MYSQL_DATABASE: testing
#         ports: ['3306:3306']
#         options: >-
#           --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
#           --health-interval=10s --health-timeout=5s --health-retries=5
#
# e trocar as variáveis do step do Pest para DB_CONNECTION=mysql,
# DB_HOST=127.0.0.1, DB_PORT=3306, DB_DATABASE=testing,
# DB_USERNAME=root, DB_PASSWORD=root.
#
# Nota: as variáveis de ambiente do step ganham sobre o <env> do phpunit.xml
# apenas porque este não define force="true". Se alterarem o phpunit.xml,
# confirmar que continua assim.
# ---------------------------------------------------------------------------
