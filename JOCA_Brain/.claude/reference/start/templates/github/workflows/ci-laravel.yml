# Phase C3 — CI: formatting, static analysis and tests.
#
# ⚠️ REPLACES the .github/workflows/tests.yml that comes in the starter kit.
#    Delete that file — if both stay, the starter kit's one runs on
#    PHP 8.3 and breaks as soon as Pest 5 comes in.
#
# Assumes: Pest 5 (PHP 8.4+), Pint and Larastan (they already come in the
# starter kit, with phpstan.neon at the root).
#
# Database: SQLite in memory, as the starter kit's phpunit.xml defines.
# If the project needs MySQL in the tests, see the note at the end of the file.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Locate the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (formatting)
        run: ./vendor/bin/pint --test

      - name: Larastan (static analysis)
        run: ./vendor/bin/phpstan analyse --no-progress

      # If the project has a frontend to compile (Vite), uncomment:
      # - uses: actions/setup-node@v7
      #   with:
      #     node-version: '24'
      #     cache: 'npm'
      # - run: npm ci && npm run build

      - name: Pest
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: ./vendor/bin/pest

# ---------------------------------------------------------------------------
# If you really do need MySQL (features that depend on the engine:
# JSON columns, full-text search, specific types), add to the job:
#
#     services:
#       mysql:
#         image: mysql:8.4
#         env:
#           MYSQL_ROOT_PASSWORD: root
#           MYSQL_DATABASE: testing
#         ports: ['3306:3306']
#         options: >-
#           --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
#           --health-interval=10s --health-timeout=5s --health-retries=5
#
# and switch the Pest step's variables to DB_CONNECTION=mysql,
# DB_HOST=127.0.0.1, DB_PORT=3306, DB_DATABASE=testing,
# DB_USERNAME=root, DB_PASSWORD=root.
#
# Note: the step's environment variables win over phpunit.xml's <env>
# only because it does not set force="true". If you change phpunit.xml,
# confirm that it stays that way.
# ---------------------------------------------------------------------------
