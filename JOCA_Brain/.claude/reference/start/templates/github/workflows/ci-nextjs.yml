# CI — Next.js 16 + React 19 (App Router, TypeScript).
#
# Versoes verificadas em Agosto 2026: next 16.3.1 · react 19.2.8.
#
# ⚠️ O gate estatico (tsc + build) prova que COMPILA, nao que FUNCIONA. Um
#    componente usado sem import passa o build do Next e so rebenta no browser.
#    Por isso o eslint NAO e opcional aqui: `react/jsx-no-undef` e `no-undef`
#    sao a unica coisa que apanha identificadores indefinidos.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Testes: descomentar quando existirem.
      # - name: Testes
      #   run: npm test -- --run

