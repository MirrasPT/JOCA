# CI — Next.js 16 + React 19 (App Router, TypeScript).
#
# Versions verified in August 2026: next 16.3.1 · react 19.2.8.
#
# ⚠️ The static gate (tsc + build) proves that it COMPILES, not that it WORKS. A
#    component used without an import passes the Next build and only blows up in
#    the browser. That is why eslint is NOT optional here: `react/jsx-no-undef`
#    and `no-undef` are the only thing that catches undefined identifiers.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Tests: uncomment when they exist.
      # - name: Tests
      #   run: npm test -- --run

