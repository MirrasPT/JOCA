# CI — Flutter (mobile app, backend separate).
#
# Stable version verified in August 2026: Flutter 3.47.0.
#
# `flutter analyze` is the equivalent of Larastan/eslint here and treats warnings
# as errors with --fatal-infos. Do not lower it to errors-only: it is the only
# static gate Dart has.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Formatting
        run: dart format --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Tests
        run: flutter test

      # Verification build. The release APK requires a keystore (repository
      # secrets) — here we only confirm that it compiles.
      - name: Build (debug)
        run: flutter build apk --debug

# ---------------------------------------------------------------------------
# To sign a release AAB, add:
#
#     - uses: actions/setup-java@v5
#       with: { distribution: 'temurin', java-version: '21' }
#     - run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/key.jks
#     - run: flutter build appbundle --release
#
# with key.properties generated from secrets. NEVER commit the keystore.
# ---------------------------------------------------------------------------
