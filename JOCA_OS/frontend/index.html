<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JOCA - DEV</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#080808" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JOCA" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <script>
      // Tema aplicado antes do primeiro paint — evita o flash do tema errado.
      // Esta lógica é um espelho mínimo de `src/lib/theme.ts`: aqui não há módulos ainda (o bundle
      // só corre depois), e esperar por ele custaria exactamente o flash que isto evita.
      try {
        var LS = localStorage;
        var mode = LS.getItem('joca-theme-mode');
        if (mode !== 'dark' && mode !== 'light' && mode !== 'auto') {
          mode = LS.getItem('joca-theme') === 'light' ? 'light' : 'dark';
        }
        var light = mode === 'light';
        if (mode === 'auto') {
          var hm = function (v) {
            var m = /^(\d{1,2}):(\d{2})$/.exec(String(v || '').trim());
            if (!m) return null;
            var h = +m[1], mi = +m[2];
            return h > 23 || mi > 59 ? null : h * 60 + mi;
          };
          var day = hm(LS.getItem('joca-theme-day')) ?? hm('08:00');
          var night = hm(LS.getItem('joca-theme-night')) ?? hm('20:00');
          var now = new Date();
          var t = now.getHours() * 60 + now.getMinutes();
          // A janela do dia pode atravessar a meia-noite, daí os dois ramos.
          light = day === night ? false : (day < night ? (t >= day && t < night) : (t >= day || t < night));
        }
        if (light) document.documentElement.dataset.theme = 'light';
        LS.setItem('joca-theme', light ? 'light' : 'dark');
        // Tema de MARCA (eixo separado do claro/escuro). Mesma razão para estar aqui: as cores da
        // marca são CSS, e aplicá-las só depois do bundle dava um flash do tema anterior.
        var brand = LS.getItem('joca-brand');
        if (brand && brand !== 'joca') {
          document.documentElement.dataset.brand = brand;
          // Ícone do separador também aqui: trocá-lo só depois do bundle deixava o favicon do tema
          // anterior no separador durante o arranque. A lista é fixa de propósito — este script
          // corre antes dos módulos, não tem acesso ao registo de `lib/brand.ts`.
          if (['alfredo', 'kitt', 'r2d2', 'hal', 'office'].indexOf(brand) >= 0) {
            var icon = document.querySelector('link[rel="icon"]');
            if (icon) icon.href = '/brand/favicon-' + brand + '.png';
          }
        }
      } catch (e) { /* ignore */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
