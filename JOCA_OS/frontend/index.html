<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The environment suffix is set at runtime from `JOCA_ENV` (see App.tsx). It used to be
         hardcoded here as "JOCA - DEV", which gave "DEV" in a production build too. -->
    <title>JOCA</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#080808" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JOCA" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <script>
      // Theme applied before the first paint — avoids the flash of the wrong theme.
      // This logic is a minimal mirror of `src/lib/theme.ts`: there are no modules here yet (the
      // bundle only runs afterwards), and waiting for it would cost exactly the flash this avoids.
      try {
        var LS = localStorage;
        var mode = LS.getItem('joca-theme-mode');
        if (mode !== 'dark' && mode !== 'light' && mode !== 'auto') {
          mode = LS.getItem('joca-theme') === 'light' ? 'light' : 'dark';
        }
        var light = mode === 'light';
        if (mode === 'auto') {
          var hm = function (v) {
            var m = /^(\d{1,2}):(\d{2})$/.exec(String(v || '').trim());
            if (!m) return null;
            var h = +m[1], mi = +m[2];
            return h > 23 || mi > 59 ? null : h * 60 + mi;
          };
          var day = hm(LS.getItem('joca-theme-day')) ?? hm('08:00');
          var night = hm(LS.getItem('joca-theme-night')) ?? hm('20:00');
          var now = new Date();
          var t = now.getHours() * 60 + now.getMinutes();
          // The day window can cross midnight, hence the two branches.
          light = day === night ? false : (day < night ? (t >= day && t < night) : (t >= day || t < night));
        }
        if (light) document.documentElement.dataset.theme = 'light';
        LS.setItem('joca-theme', light ? 'light' : 'dark');
        // BRAND theme (axis separate from light/dark). Same reason for being here: the brand colors
        // are CSS, and applying them only after the bundle gave a flash of the previous theme.
        var brand = LS.getItem('joca-brand');
        if (brand && brand !== 'joca') {
          document.documentElement.dataset.brand = brand;
          // Tab icon also here: swapping it only after the bundle left the favicon of the previous
          // theme in the tab during startup. The list is fixed deliberately — this script runs
          // before the modules, it has no access to the registry in `lib/brand.ts`.
          if (['alfredo', 'kitt', 'r2d2', 'hal', 'office'].indexOf(brand) >= 0) {
            var icon = document.querySelector('link[rel="icon"]');
            if (icon) icon.href = '/brand/favicon-' + brand + '.png';
          }
        }
      } catch (e) { /* ignore */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
